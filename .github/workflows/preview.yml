name: Preview Deploy

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PROJECT_ID: debageri-portal
  SERVICE: debageri-portal
  AR_REPOSITORY: debageri-portal

jobs:
  preview:
    name: Validate · Build · Push · Preview
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive preview tag
        id: tag
        run: |
          SLUG=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9]|-|g' | cut -c1-20 | sed 's/-*$//')
          test -n "$SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run check:project
      - run: npm run ci
        env:
          PORTAL_ENVIRONMENT: test
          PORTAL_EXPECTED_PROJECT_ID: debageri-portal-local
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: debageri-portal-local
          FIREBASE_ADMIN_PROJECT_ID: debageri-portal-local
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "false"

      - name: Validate cloud target
        run: |
          test "$PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test -n "$REGION"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Check production service
        id: service
        run: |
          if gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "### Preview deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The Cloud Run service does not exist yet. Merge this PR so the main deployment can create it; subsequent branches will receive zero-traffic previews." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Artifact Registry
        if: steps.service.outputs.exists == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push production-connected preview
        if: steps.service.outputs.exists == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          APP_CHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_CHECK_RECAPTCHA_SITE_KEY }}
        run: |
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_AUTH_DOMAIN"
          test -n "$FIREBASE_STORAGE_BUCKET"
          test -n "$FIREBASE_APP_ID"
          test -n "$FIREBASE_MESSAGING_SENDER_ID"
          test -n "$APP_CHECK_SITE_KEY"
          REGISTRY="${REGION}-docker.pkg.dev"
          IMAGE="${REGISTRY}/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE}:preview-${{ steps.tag.outputs.slug }}"
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_CHECK_RECAPTCHA_SITE_KEY="$APP_CHECK_SITE_KEY" \
            --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy zero-traffic preview revision
        if: steps.service.outputs.exists == 'true'
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --no-traffic \
            --tag "${{ steps.tag.outputs.slug }}" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "PORTAL_ENVIRONMENT=production,PORTAL_EXPECTED_PROJECT_ID=${PROJECT_ID},FIREBASE_ADMIN_PROJECT_ID=${PROJECT_ID},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET},NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID},NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID},NEXT_PUBLIC_USE_FIREBASE_EMULATORS=false" \
            --quiet

      - name: Print preview URL
        if: steps.service.outputs.exists == 'true'
        run: |
          HOST=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format="value(status.url)" | sed 's|https://||')
          echo "Preview URL: https://${{ steps.tag.outputs.slug }}---${HOST}"
          echo "This preview is connected to production Firebase data. Test carefully."
