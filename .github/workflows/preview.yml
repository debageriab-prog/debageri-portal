name: Development Preview

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-preview
  cancel-in-progress: true

env:
  EXPECTED_PROJECT_ID: debageri-portal-dev
  SERVICE: debageri-portal-dev
  AR_REPOSITORY: debageri-portal

jobs:
  preview:
    name: Validate · Build · Deploy Development
    runs-on: ubuntu-latest
    environment: development
    env:
      PROJECT_ID: ${{ secrets.DEV_GCP_PROJECT_ID }}
      REGION: ${{ secrets.DEV_GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run check:project
      - run: npm run ci
        env:
          PORTAL_ENVIRONMENT: test
          PORTAL_EXPECTED_PROJECT_ID: debageri-portal-local
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: debageri-portal-local
          FIREBASE_ADMIN_PROJECT_ID: debageri-portal-local
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "false"

      - name: Validate development target
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.DEV_GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          test "$PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test "$PROJECT_ID" != "debageri-portal"
          test -n "$REGION"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          case "$RUNTIME_SERVICE_ACCOUNT" in
            *@"${PROJECT_ID}.iam.gserviceaccount.com") ;;
            *) echo "Development runtime identity is outside the development project" >&2; exit 1 ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Show isolated deployment identity
        run: |
          echo "Authenticated deployer: $(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Development target: ${PROJECT_ID}"

      - name: Deploy development Firebase configuration
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push development image
        env:
          FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          APP_CHECK_SITE_KEY: ${{ secrets.DEV_FIREBASE_APP_CHECK_SITE_KEY }}
        run: |
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_AUTH_DOMAIN"
          test -n "$FIREBASE_STORAGE_BUCKET"
          test -n "$FIREBASE_APP_ID"
          test -n "$FIREBASE_MESSAGING_SENDER_ID"
          REGISTRY="${REGION}-docker.pkg.dev"
          IMAGE="${REGISTRY}/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_CHECK_RECAPTCHA_SITE_KEY="$APP_CHECK_SITE_KEY" \
            --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy stable development service
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.DEV_GCP_RUNTIME_SERVICE_ACCOUNT }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          APP_CHECK_SITE_KEY: ${{ secrets.DEV_FIREBASE_APP_CHECK_SITE_KEY }}
          REMINDER_ENCRYPTION_KEY: ${{ secrets.DEV_REMINDER_ENCRYPTION_KEY }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars "PORTAL_ENVIRONMENT=development,PORTAL_EXPECTED_PROJECT_ID=${PROJECT_ID},FIREBASE_ADMIN_PROJECT_ID=${PROJECT_ID},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET},NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID},NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID},NEXT_PUBLIC_FIREBASE_APP_CHECK_RECAPTCHA_SITE_KEY=${APP_CHECK_SITE_KEY},NEXT_PUBLIC_USE_FIREBASE_EMULATORS=false,REMINDER_CREDENTIAL_ENCRYPTION_KEY=${REMINDER_ENCRYPTION_KEY}" \
            --quiet

      - name: Print development URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format="value(status.url)")
          echo "Development URL: ${URL}"
          echo "All feature branches deploy to this stable development service and use only ${PROJECT_ID}."
